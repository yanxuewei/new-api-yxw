# 雅加达 pre · new-api-pre 工作负载（任务 45 步骤 5；Namespace/ResourceQuota/SA 由
# deploy/jakarta_pre/bodies/create_ns.sh 建，本文件只管 ConfigMap / Deployment / Service）
#
# 形状抄 deploy/jakarta_dev/newapi-dev.yaml（新加坡 dev 站已验收的那套），五处**有意偏差**都有依据：
#   ① 落点 = 雅加达集群 cb0abf5b…、命名空间 `new-api-pre`，**与 dev 共用节点池 `np-jkt-dev-app`**
#      （项目负责人裁定 ⑤）⇒ 不写 nodeSelector / nodeAffinity / tolerations，只靠 ResourceQuota 约束用量。
#   ② DSN 走 **6432 托管池**：雅加达实例现已开池且 `pgbouncer.pool_mode=session`（实测见台账 §17）；
#      dev 当年写 5432 是因为**那时没有池**（6432 BLOCKED）。session 模式下池不改语义，
#      这一条同时是"池真的能用"的端到端证据（比 TCP 握手强）。perf 侧同样走 6432（与生产同形状），见 new-api-perf.yaml 偏差③。
#   ③ **不挂 Redis**：dev 现网 Secret 已有 `REDIS_CONN_STRING`，pre 若复用同一实例同一库
#      ⇒ 缓存/会话键空间互串（new-api 的 Redis key 不带环境前缀）。pre 用 `MEMORY_CACHE_ENABLED=false`。
#   ④ **无 `LOG_SQL_DSN`**：裁定只建 `newapi_pre` / `newapi_perf` 两库，不建 pre 专用日志库
#      ⇒ 日志表随主库 AutoMigrate 一起建（由 `newapi_migrate` 执行，运行账号只读写字段）。
#   ⑤ `SESSION_SECRET` **独立生成**，与 dev、马尼拉 prod 都不同（指南坑 1：共用即跨环境越权）。
#
# 红线核对：无明文密钥（Secret 由 deploy/jakarta_pre/pre_deploy.sh 从保管目录注入）；
# 镜像 tag = 日期+git sha，禁 latest；只允许 `newapi-dev/*` 仓库，**禁止**引用 `newapi-prod/*`。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-config
  namespace: new-api-pre
  labels:
    app: new-api
    project: new-api
    site: jkt-dev
    track: pre
    env: dev
data:
  TZ: "Asia/Jakarta"
  NODE_TYPE: "master"                   # pre 单副本自持 AutoMigrate（与 dev 同构）
  MEMORY_CACHE_ENABLED: "false"         # 偏差③：pre 不挂 Redis，这行是真生效
  SYNC_FREQUENCY: "30"
  SQL_MAX_OPEN_CONNS: "10"              # 连接账目：dev(3 负载×20) + pre(1×10) + perf(1×10) ≤ 实例上限，见台账 §17
  SQL_MAX_IDLE_CONNS: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api-pre
  namespace: new-api-pre
  labels:
    app: new-api
    project: new-api
    site: jkt-dev
    track: pre
    env: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: new-api, track: pre}
  template:
    metadata:
      labels:
        app: new-api
        project: new-api
        site: jkt-dev
        track: pre
        env: dev
      annotations:
        checksum/config: "__CONFIG_CHECKSUM__"   # 由 pre_deploy.sh 用集群现值渲染，避免改 CM 不滚动
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: new-api-app
      terminationGracePeriodSeconds: 30
      # 与 dev 共用机器 ⇒ 副本落哪台由调度器决定；单副本用 ScheduleAnyway，不做硬约束
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: new-api, track: pre}
      containers:
        - name: new-api
          image: acr-newapi-mnl-registry.ap-southeast-6.cr.aliyuncs.com/newapi-dev/newapi-master:20261015-c62445555
          imagePullPolicy: IfNotPresent
          args: ["-log-dir=/data/logs"]
          ports:
            - {name: http, containerPort: 3000}
          volumeMounts:
            - {name: app-logs, mountPath: /data/logs}
          env:
            - {name: NODE_TYPE, value: "master"}
            - {name: GOMAXPROCS, value: "1"}
            - {name: SQL_SLOW_THRESHOLD_MS, value: "1"}
            # 与生产 master 同构（ph/master-deployment.yaml:96-105）：代码里没有 SQL_DSN_MIGRATE 这个
            # env，只有 SQL_DSN；schema 最小化后 public 只有 newapi_migrate 持 CREATE ⇒ 必须取它。
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: SQL_DSN_MIGRATE
          envFrom:
            - configMapRef: {name: new-api-config}
            - secretRef: {name: new-api-secrets}
          startupProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            # ⚠ 不是"越小越好"，是被实测逼出来的：2026-10-15 首跑 500m/1Gi 时两个副本全 Pending，
            #   scheduler 原文 `0/3 nodes are available: 1 Too many pods, 3 Insufficient cpu`。
            #   实测 requests 账目（不是使用率，使用率只有 2%）：三台节点 allocatable 各 1930m，
            #   已请求 1.77 / 1.69 / 1.80 核 —— 大头是 `arms-prometheus` 一个 Pod 就报 **1 核**，
            #   且 dev 现网的三个负载早已改成 100m/200m（仓库清单里的 500m 是旧值）⇒ 按 requests
            #   调度时整个节点池只剩 ~130–240m。pre 要"与 dev 共机"（裁定 ⑤）就只能贴这个余量取 100m。
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: app-logs
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-pre
  namespace: new-api-pre
  labels: {app: new-api, track: pre}
spec:
  type: ClusterIP
  selector: {app: new-api, track: pre}
  ports:
    - {name: http, port: 80, targetPort: http}
