# newapi-np —— 证书到位前的 ALB 直连 IP 通道后端 Service
#
# 用途：ALB `alb-1riqckb1h8ezm0y7s9` 的 HTTP 80 监听（default action）
#       经 Ecs 型服务器组 `sgp-fm7kdwz99wtzbffkfx` 挂 4 节点 IP:32656 → 本 Service → Pod
#
# ★ nodePort 已固化 32656（2026-10-06）：
#   原因是 ALB 服务器组里写死了「节点 IP:32656」，一旦重建 Service 时 k8s
#   从 30000-32767 重新随机分配，端口一变服务器组后端就全失效（ALB 不会自动跟随）。
#   显式声明 nodePort 后，apply 幂等、重建不变号。
#
# 生命周期：临时手段。证书到位后应改走 ALB Ingress Controller 托管的
#           Eni/Pod-IP 型服务器组 `sgp-tqgwt413t19mum8oa9`（Ingress new-api-verify
#           派生），届时本 Service 与配套的节点 SG 规则可一并删除。
#
# apply: kubectl apply -f manifests/newapi-np.yaml
apiVersion: v1
kind: Service
metadata:
  name: newapi-np
  namespace: new-api
  labels:
    purpose: pre-cert-direct-access
    managed-by: manual-task19
spec:
  type: NodePort
  # Cluster：ALB 落到任一节点都能二次转发到其他节点的 Pod（需跨节点 SG 放行已就位）
  # 曾试 Local（仅本节点 Pod），无收益且降低可用性，已回退
  externalTrafficPolicy: Cluster
  selector:
    app: new-api
    track: stable
  ports:
    - name: http
      protocol: TCP
      port: 80          # ClusterIP 端口（集群内）
      targetPort: 3000  # 容器内 new-api 监听端口
      nodePort: 32656   # ★ 固化值，勿改；ALB 服务器组依赖此端口
