# 任务 25 · 新加坡（备站）Ingress `new-api-ph-standby`
# 集群：ca75829e3492d491d9d434de087913798（ap-southeast-1）
# 后端：Service/new-api-ph-standby:80 → Pod:3000（任务 28 已就绪，2/2 Running，跨 AZ）
#
# ===== 状态（2026-10-12 更新）=====
#   ✅ 443/TLS 已上线（G5 证书闭环后），listen-ports = [{"HTTP":80},{"HTTPS":443}]
#   ✅ 追加公网 host `sg.likha.hk`（见下方「2026-10-12 修复」）
#   ✅ rules 顺序回改为与集群实况一致（规则1=internal、规则2=sg.likha.hk；只读取证）
#
# ⚠️ 与任务卡的一处**有意偏差**（历史，已消解）：
#   任务卡写 `alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'`，
#   但当时 CAS 证书缺失 ⇒ 443 监听器无从创建，降级为 HTTP:80。
#   **2026-10-12 G5 闭环后已补齐 443**（AlbConfig sg-alb 已带通配符证书）。
#
# ⚠️ **2026-10-12 修复（502 Bad Gateway）**
#   现象：浏览器访问 https://sg.likha.hk → **502**（ALB 错误页，页脚 alb）。
#   根因：443 监听上**只有**一条规则 Host=`sg-standby.internal.likha.hk`；
#         `sg.likha.hk` 无匹配 ⇒ 落监听器**默认动作** ⇒ 派生占位组
#         `sgp-l3cxrmoj1oq451l0fn`（`kube-system-fake-svc-443`，指向**节点 IP:3000**、
#         健康检查 off）⇒ 无服务监听 ⇒ 502。
#         80 端口因存在**无 Host 兜底** Ingress（`new-api-ph-standby-ip`）而不受影响，
#         所以「HTTP 正常、HTTPS 502」——这是问题被掩盖的原因。
#   修复：本 Ingress 追加 `host: sg.likha.hk`（保留原内部 host），使 443/80 各生成
#         一条显式 Host 规则 → 后端组 `sgp-rlxs1mqishcxcfkx7u`（2 台 ENI 全健康）。
#
# == 关键资源（2026-10-12）==
#   ALB      alb-amdwm60xmznh7s1nae（alb-newapi-sg，Active/Internet/Standard/PostPay）
#   DNS      alb-amdwm60xmznh7s1nae.ap-southeast-1.alb.aliyuncsslbintl.com
#   公网 IP  43.98.186.238（ap-southeast-1a）· 47.237.68.142（ap-southeast-1b）
#   监听器   lsn-qmi1hpyr3j83tq3z8j :80 HTTP
#            lsn-iqn5i233mvv7eu4u6w :443 HTTPS（证书 606823-ap-southeast-1）
#   DNS 记录 sg.likha.hk → 上述双公网 IP（见 deploy/manifests/dns-likha-hk.sh）
#
# ⚠️ 备注：本文件此前与集群实况**漂移**（10-12 只 annotate 了集群、未回写本文件）。
#    本次已对齐；**今后改监听端口/域名必须同时改本文件**。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api-ph-standby
  namespace: new-api
  labels:
    app: new-api
    site: ph-sg
    env: prod
  annotations:
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-enabled: "true"
    alb.ingress.kubernetes.io/healthcheck-path: /api/status
    alb.ingress.kubernetes.io/healthcheck-method: GET
    alb.ingress.kubernetes.io/healthcheck-httpcode: http_2xx
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "6"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "3"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/connection-drain-enabled: "true"
    alb.ingress.kubernetes.io/connection-drain-timeout: "120"
spec:
  ingressClassName: alb
  # 规则顺序与集群实况一致（2026-10-12 取证并回改）：
  #   规则1 = 内部域名，规则2 = 公网域名 ⇒ ALB 侧优先级 1 / 2 与之对应。
  #   两个 host 均为精确/通配符匹配、互不冲突，顺序不影响路由结果。
  rules:
    # 内部域名：仅 SNI/Host 路由与内部验收，不入公网 DNS
    - host: sg-standby.internal.likha.hk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api-ph-standby
                port:
                  number: 80
    # 公网域名（2026-10-12 追加）：HTTPS/SNI 访问备站
    - host: sg.likha.hk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api-ph-standby
                port:
                  number: 80
