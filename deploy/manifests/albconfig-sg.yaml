# 任务 25 · 新加坡（备站）AlbConfig `sg-alb`
# 集群：ca75829e3492d491d9d434de087913798（ap-southeast-1，2 节点 1.35.7）
# 对应 IngressClass：`alb`（parameters.name = sg-alb，已建 2026-10-06）
#
# ✅ 状态：**已 apply**（2026-10-06 建 ALB 骨架；2026-10-12 追加 443 + TLS 证书，验收通过）。
#
# 与马尼拉同构（`deploy/aliyun/ph/albconfig.rendered.yaml`）的三处**有意差异**：
#   ① config.name = alb-newapi-sg（马尼拉 alb-newapi-mnl）
#   ② accessLogConfig.logStore = **alb_access**（下划线）。★ 硬约束：ALB Ingress webhook
#      `albconfig.alb.validate.k8s.io` 会校验 **「logstore name should start with alb_」**
#      （2026-10-06 实测被拒：`logstore name should start with alb_`）⇒ 必须下划线前缀。
#      注意 `sls-newapi-sg` 原本只有一个连字符的 `alb-access`（不合规），已补建 `alb_access`
#      （ttl=30 / shardCount=2 / standard，与马尼拉 `sls-newapi-mnl/alb_access` 同参数）。
#   ③ tags site = ph-sg
#
# 管理红线（任务 19 同规）：只经 AlbConfig/Ingress 声明式管理，禁止控制台改 listener。
# ⚠️ AlbConfig 是 **Cluster-scoped**（实测 mnl-alb spec.scope=Cluster）⇒ 不写 namespace，命令不带 -n。
# ⚠️ finalizer `ingress.k8s.alibaba/resources` ⇒ `kubectl delete albconfig sg-alb` 会
#    **级联删除云上 ALB 实例**。可改，不可删。
apiVersion: alibabacloud.com/v1
kind: AlbConfig
metadata:
  name: sg-alb
  labels:
    project: new-api
    site: ph-sg
    env: prod
spec:
  config:
    name: alb-newapi-sg
    addressType: Internet
    zoneMappings:
      - vSwitchId: vsw-t4ncxa4gqgamhl0o8e6yq   # vsw-sg-pub-a / ap-southeast-1a / 10.1.0.0/24
      - vSwitchId: vsw-t4nhtsfk2z79e1ggvlhdz   # vsw-sg-pub-b / ap-southeast-1b / 10.1.1.0/24
    accessLogConfig:
      logProject: sls-newapi-sg
      logStore: alb_access
    tags:
      - { key: project, value: new-api }
      - { key: site, value: ph-sg }
      - { key: env, value: prod }

  # ────────────────────────────────────────────────────────────────────────────
  # listeners（★ 2026-10-12 更新：443 已上线并验收）
  #
  # 80：官方最小形态（只给 port + protocol + 超时），**不写 default action**。
  #   依据：官方《通过 AlbConfig 配置 ALB 实例》创建示例即 `- port: 80 / protocol: HTTP`；
  #   监听器默认动作由 Controller 自管（命名 `ingress-auto-listener-{port}`，默认动作指向
  #   占位组 `kube-system-fake-svc-<port>`）。好处：**零字段名猜测**。
  #
  # ★★ 绝不要在这里写 `defaultActions` / `httpDefaultActions`（**实测均无效**）：
  #   2026-10-06 SG 侧零风险探针 —— 写入 `defaultActions: [{type: FixedResponse, ...}]`，
  #   k8s 侧 spec 保留该字段，但云端 `GetListenerAttribute` 回读 `DefaultActions` **仍是**
  #   Controller 派生的 ForwardGroup 占位组。⇒ 80 上的 HTTP→HTTPS 301 **不能**写在这里。
  #
  # ★★ 443 证书字段名（2026-10-12 血泪）：`certificates[].**CertificateId**`，
  #   **值**才是 CertIdentifier（如 `606823-ap-southeast-1`）。写成 `CertIdentifier:` 会被
  #   CRD 的 `x-kubernetes-preserve-unknown-fields` **静默忽略**（不报错、证书不绑定）。
  #   注意 SG 是 ap-southeast-1（与证书本地同地域）；马尼拉 ap-southeast-6 用**同一个**
  #   CertIdentifier 也成功 Associated（跨地域可用，详见 albconfig.rendered.yaml 尾注）。
  #
  # 验收实测（2026-10-12，SG 侧）：
  #   Listener lsn-iqn5i233mvv7eu4u6w · 443 · HTTPS · Running
  #   ListListenerCertificates → 606823-ap-southeast-1 / Server / IsDefault / Associated
  #   openssl s_client -servername sg-standby.internal.likha.hk → CN=*.likha.hk，Verify 0 (ok)
  #   curl --resolve sg-standby.internal.likha.hk:443:{43.98.186.238,47.237.68.142} → 200 / 200
  # ────────────────────────────────────────────────────────────────────────────
  listeners:
    - port: 80
      protocol: HTTP
      idleTimeout: 60          # ✅ SG 侧实测生效（2026-10-06 回读 IdleTimeout=60）
      requestTimeout: 600      # ✅ SG 侧实测生效（回读 RequestTimeout=600；ALB 硬上限）
    - port: 443
      protocol: HTTPS
      idleTimeout: 60
      requestTimeout: 600
      caEnabled: false
      securityPolicyId: tls_cipher_policy_1_2_strict_with_1_3
      certificates:
        - CertificateId: 606823-ap-southeast-1   # ← 字段名必须是 CertificateId
          IsDefault: true
  # ────────────────────────────────────────────────────────────────────────────
