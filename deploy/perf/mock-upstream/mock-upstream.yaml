# mock 上游（任务 33：S1–S10 压测供流）—— 部署在 new-api-perf，6 副本（卡面口径）
#
# 供流地址（new-api channel Base URL 填这个）：
#   http://mock-upstream.new-api-perf.svc.cluster.local:80
#   （new-api 侧 channel type=OpenAI，模型 mock-gpt；/v1/chat/completions 同时支持 SSE 与 JSON）
#
# 参数矩阵（全部可 env 覆盖；运行时也可 POST /__ctrl 热改，GET /__state 回读）：
#   FIRST_TOKEN_DELAY_MS  首字延迟（默认 300ms，卡面口径）
#   TOKEN_INTERVAL_MS     每 token 间隔（默认 30ms，卡面口径）
#   TOKENS_PER_RESPONSE   单响应 token 数（默认 50 ⇒ SSE 时长 ≈ 300ms + 50×30ms ≈ 1.8s）
#   TOKEN_TEXT_BYTES      每 token 文本字节（默认 12；调大用于"真实响应体大小"口径，坑 3）
#   ERROR_RATE / ERROR_STATUS  注入错误率与状态码（**默认 0**，见下方偏差说明；S5 用 0.5/500）
#   EXTRA_LATENCY_MS      额外上游延迟（S5 用 5000）
#
# ⚠ 对卡面的两处有意偏差：
#   ① ERROR_RATE 默认 0 而非 0.001：0.1% 注入本身就会顶破 S1/S2 的「5xx ≤0.05%」判据，
#      等于自带毒化；错误注入改为只在 S5（显式 /__ctrl）时打开。
#   ② 多了 TOKENS_PER_RESPONSE / TOKEN_TEXT_BYTES / EXTRA_LATENCY_MS 三个旋钮：
#      对应坑 3「压测必须用真实响应体大小」与 S5「延迟 5s」。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-upstream
  namespace: new-api-perf
  labels: {app: mock-upstream, purpose: perf-mock, site: jkt-dev}
spec:
  replicas: 6
  revisionHistoryLimit: 2
  selector:
    matchLabels: {app: mock-upstream}
  template:
    metadata:
      labels: {app: mock-upstream, purpose: perf-mock, site: jkt-dev}
    spec:
      serviceAccountName: new-api-app          # 复用 ns 内既有 SA（拉 ACR 镜像用，无 RBAC）
      containers:
        - name: mock
          image: acr-newapi-mnl-registry.ap-southeast-6.cr.aliyuncs.com/newapi-dev/mock-upstream:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: FIRST_TOKEN_DELAY_MS, value: "300"}
            - {name: TOKEN_INTERVAL_MS, value: "30"}
            - {name: TOKENS_PER_RESPONSE, value: "50"}
            - {name: TOKEN_TEXT_BYTES, value: "12"}
            - {name: ERROR_RATE, value: "0"}
            - {name: ERROR_STATUS, value: "500"}
            - {name: EXTRA_LATENCY_MS, value: "0"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}   # 6 副本 × 100m = 600m，dev 两节点余量充足
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mock-upstream
  namespace: new-api-perf
  labels: {app: mock-upstream, purpose: perf-mock}
spec:
  type: ClusterIP
  selector: {app: mock-upstream}
  ports:
    - {name: http, port: 80, targetPort: http}
