# ── 续签窗口动作（2027-03 前，notAfter=2027-04-28 的 30 天前）──────────────────
# ★ 口径已随 2026-10-15 的路② 落地**反转**（务必先读）：
#   两地 443 的实际出证来源现在是 **Ingress spec.tls 的 Secret**（同域名压住 AlbConfig 钉死证，实测见
#   evidence_20261012.probe_sni_priority + evidence_20261015）。⇒
#     ✅ **刷 Secret = 必需路径**（不刷 = 到期当晚 443 挂，且新证即使已签发也不会被采用）；
#     ⏬ AlbConfig 换绑（原 R2）降级为"保持声明与云端一致"的**次要动作**，单独做它**不再足以**恢复 443。
#   旧口径（"监听只认 AlbConfig 钉死的 CertificateId"）已失效，仅在 Secret/锚定件被删除的回滚态下才重新成立。
# ⚠ 通道唯一：ALB 是 ServiceManagedResource，直调 `alb UpdateListenerAttribute` 被服务端拒
#   `OperationDenied.ServiceManagedResource`（本仓实测 3/3）⇒ 只能改 AlbConfig 再 apply，或走 Secret。
#   控制台同样改不了（会被调谐覆盖）。
# ✅ 机制前提三条全部实测成立（2026-10-13）：不重建监听 / 与钉死证共存 / 同域名 Secret 优先（已排除"有效期优先"解释）。
# ⇒ AlbConfig 的 certificates 字段**保留不撤**（避开 Replace 语义的监听重建风险）。
# ⚠ 尚未闭合的缺口（roadmap，负责人知悉）：
#   G1 **刷 Secret 的执行器还不存在**（路② 只剩这一项）。在它上线之前，续签仍需人工按 evidence_20261015
#      的 W1 流程重投 Secret（甲通道）⇒ 现阶段"人工动作归零"这个目标**尚未兑现**。
#      执行器写入门禁（缺一即拒写并告警，禁止"先写再修"）：SAN 覆盖 + `-modulus` 配对 + notAfter 未过期 + 链 leaf 在前。
#      执行器还需 CAS **读**凭据（按惯例由负责人自配）。
#   G2 **「Secret 内证书已过期时是否仍优先」未证** —— 现有证据只到"有效期更短但未过期仍胜出"。
#      若要补探针，代价是生产 443 短时出错误证（覆盖是监听级），须单独授权。
#   G3 续签后**私钥是否不变**未证（决定刷 Secret 要不要重下私钥）；不要假设可以只换公钥。
renewal:
  due_by: "2027-03-29"
  target_state: 路② 已落地（两地 Secret 来源实际接管 443）；**剩 G1：刷 Secret 执行器未实现**，故当前续签仍需人工重投 Secret
  steps:
    - id: R1
      name: 确认新证书已签发
      cmd: "aliyun cas ListInstances --region ap-southeast-1 --cli-query 'InstanceList[].[InstanceId,Spec,CertificateStatus,CertificateId,CertIdentifier,AutoReissue]'"
      expect: 出现新的 issued 记录（CertId ≠ 606823），SAN 仍含 *.likha.hk 与 likha.hk
      note: |
        ⚠ 若确实是**新 CertId**，除 R2 的两地 ALB 换绑外，**还必须重绑 OSS 目标**
        （`- target: oss` 的 renew_action，bucket=img-likha / domain=img.likha.hk）——
        OSS 不读 AlbConfig，漏了它 `img.likha.hk` 会在旧证到期当晚 HTTPS 失效。
        若 CertId 未变（同证内容更新），仍须复验 OSS 绑定侧 Fingerprint/ValidEndDate 是否跟上。
      gate: 未取得新 CertIdentifier 前不执行 R2/R3
    - id: R2
      name: 换绑两地 HTTPS 监听（声明式；**路② 落地后已是次要动作，不再决定实际出证**）
      cmd: |
        # ⚠ 禁止 aliyun alb UpdateListenerAttribute：ACK 托管的 ALB 是 ServiceManagedResource，
        #   直接调 alb OpenAPI 会被服务端拒绝（OperationDenied.ServiceManagedResource，2026-10-12 实测），
        #   控制台同样改不了；只能改 AlbConfig 再 apply（CRD 无 schema ⇒ 写错字段名会被静默忽略）。
        # ⚠ 本步骤只做它自身：让 AlbConfig 声明与钉死证跟上。**它不能单独恢复 443** ——
        #   同域名出证由 Secret 决定（见上方 ★ 口径反转）。必须与 R5 成对执行。
        # 1) 改声明（两地域各一份，SSOT = deploy/aliyun/ph/albconfig.rendered.yaml / deploy/manifests/albconfig-sg.yaml）
        #      listeners[].certificates[].CertificateId: <new-cert-identifier>   ← 字段名必须是 CertificateId
        # 2) apply：马尼拉走跳板机 kubectl（云助手→跳板机 或 ops-access 临时放行），新加坡走 deploy/lib/ack_remote.sh sg
        kubectl apply -f deploy/aliyun/ph/albconfig.rendered.yaml      # 马尼拉（albconfig mnl-alb）
        # 新加坡：kubectl apply -f deploy/manifests/albconfig-sg.yaml（经 ack_remote.sh sg 下发）
      expect: |
        两监听云端回读一致（这是唯一可信判据，k8s 侧 spec 写错也会"看着已配"）：
          aliyun alb GetListenerAttribute --region ap-southeast-6 --ListenerId lsn-hjl2cz2g9oqvee4eix | jq '.Certificates'
          aliyun alb GetListenerAttribute --region ap-southeast-1 --ListenerId lsn-iqn5i233mvv7eu4u6w | jq '.Certificates'
        ⇒ 钉死位 CertificateId == <new-cert-identifier>；cert_count 仍为 2（Secret 证在 R5 后同步换新）
    - id: R3
      name: 重新落保管目录并验配对（旧副本覆盖，不留第二份）
      cmd: "bash deploy/logs/tls_store_20261012.sh   # 需把 CertId 改为新值；严禁开 bash -x"
      expect: ls -l 两文件 600、cert_blocks=3、-modulus md5 两侧一致
    - id: R4
      name: 端到端验 443
      cmd: "curl -svI https://www.likha.hk -o /dev/null 2>&1 | grep -E 'subject:|expire date:'   # 三入口各测一次（www.likha.hk / sg.likha.hk / img.likha.hk），并用 openssl s_client -showcerts 复核链块数=3 与 leaf 在前"
      expect: expire date 为新证的 2027-xx 日期；server cert 链与 SAN 不变；img.likha.hk 同时复验 OSS 绑定侧指纹（见下方 oss 目标的 renew_action）
      note: |
        ⚠ 本步骤的判据口径已更新：**现网 443 出证来自 K8s Secret**（deploy/manifests/ingress-alb-tls-anchor.yaml
        + Secret/new-api-tls，2026-10-15 落地）⇒ 只跑 R2 不跑 R5 时，本步骤会**仍然回旧证**，
        这不是 R2 失败而是来源被 Secret 接管。⇒ 验收必须 R2+R5 成对，再以此步为准。
        到期当晚的选证依据是**同域名 Secret 优先**（✅ 已实测：长短有效期两轮自签均 100% 胜过钉死证，
        "有效期优先"解释已被排除）。
        ⚠ 同一结论的反面就是本步骤的风险面：坏 Secret 会立即接管该监听所有域名的出证 ⇒ 写入前必须过校验门禁。
    - id: R5
      name: 刷新两地 TLS Secret（**路② 下的必需路径**；执行器未就绪前按本条人工执行）
      cmd: |
        # 写前门禁（任一不过 → 拒绝写入并告警；禁止"先写再修"）：
        #   SAN 覆盖 www/sg/likha.hk、证书与密钥 -modulus md5 配对、notAfter 未过期、链 3 块且 leaf 在前
        # 落地通道（甲 = ECS 云助手 RunCommand，正文上限 16KB ⇒ 拆块 DER + tar.gz + base64）：
        #   执行器模板见 deploy/logs/t_p29_w1a_gen.sh + t_p29_w1_node_template.sh + t_p29_w1b_node.sh
        kubectl -n new-api create secret tls new-api-tls \
          --cert=/root/.deploy_secrets/TLS_WILDCARD_CRT --key=/root/.deploy_secrets/TLS_WILDCARD_KEY \
          --dry-run=client -o yaml > stage/secret.yaml
        kubectl -n new-api apply -f stage/secret.yaml && shred -u stage/secret.yaml
        # ⚠ 私钥只走文件参数，绝不出现在命令行明文；脚本禁开 set -x；证据落盘前剥敏
      expect: |
        ① etcd 回读解码复验新 serial/SAN/notAfter 与配对 md5（不能只看 apply 返回"configured"）；
        ② ListListenerCertificates 两地 cert_count=2 且 Secret 证 CertificateId 换成新值；
        ③ SNI 采样 serial = 新证 serial（三入口各 ≥2 次）；
        ④ 旧上传证书按 SerialNo 白名单 DeleteUserCertificate --region cn-hangzhou 并复验
           （控制器上传证的命名与端点见 evidence_20261015 的"副产物（清理台账）"）；
        ⑤ 既有业务 Ingress resourceVersion 与 443 基线 RuleId 逐字未动（只应有锚定件那一条规则）。
      note: 私钥是否随续签保持不变未证（G3）⇒ 默认按"需要重下私钥"准备，不要假设可只换公钥。
  also_note: 若同时决定接 WAF（F15 复评），WAF 域名证书须一并换绑；本文件 waf 条目当前 not-in-this-round。
  oss_note: |
    OSS（bucket=img-likha / domain=img.likha.hk）换证是**独立通道**（put-cname，不读 AlbConfig），
    与 R2 的 ALB 换绑必须分别执行 —— 见下方 oss 目标的 renew_action；R4 复验含 img.likha.hk。
