# Day 1 · 任务 3 步骤 4：证书部署目标登记（模板 + 实况销账，不自动下发）
#
# 用途：v2.0 旧时序在 D1 空跑部署任务找不到资源、后续靠手工补，D6 才发现某处仍用自签/旧证书。
#       本文件把"证书要落到哪些资源"显式列成清单，执行时逐项销账。
# 消费方式（2026-10-15 更新）：**路② 已落地（两地）** —— Ingress `spec.tls` + `Secret/new-api-tls`
#   已实际接管两地 443 的出证（锚定件见 deploy/manifests/ingress-alb-tls-anchor.yaml）。
#   ⇒ 本文件的**实际生效来源是 Secret**，AlbConfig 里钉死的 CertificateId 仍在（保留不撤，见下），
#     但它已不是同域名的出证决定者。续签动作的产物必须是**刷新的 Secret**（见 renewal）。
#   ⚠ 不要直调 ALB OpenAPI 换绑（ServiceManagedResource 被拒），也不要在 ALB 控制台改监听（会被调谐覆盖）。
#   ⚠ CAS 部署任务通道实测能跑到 success 但**不能判它改得动 CertId**（同证探针无法区分 no-op），
#     不作为免人工依据 —— 见下方 evidence_20261012.probe_cas_deploy。
# ⚠ 本文件只登记资源标识与状态，**不得**写入任何私钥/口令。
#
# 证书本体（2026-10-12 G5 闭环）：
#   InstanceId        cas_intl-sg-4rf4zyk0u00s
#   CertId / CertIdentifier  606823 / 606823-ap-southeast-1
#   Spec              ali.dv.w（DV 通配符，非 OV）
#   SAN               *.likha.hk, likha.hk
#   notBefore/notAfter 2026-10-12 / 2027-04-28（198 天，CA/B 新规）
#   AutoReissue       enable（2026-10-12 经授权 UpdateInstance 开启；写前 disable，GetInstanceDetail
#                     与 ListInstances 双路回读均为 enable）
#                     ⚠ 开关已开 ≠ 443 自动续期（2026-10-12 二次取证，指南任务 3 卡 ★ 段）：
#                     该口径（"监听只认 AlbConfig 钉死证"）在 2026-10-15 路② 落地后**已被反转**：
#                     同域名出证来源现在是 Ingress spec.tls 的 Secret ⇒ 新证签发后**必须刷 Secret**
#                     （见 renewal 的 R5），只改 AlbConfig 不再足以恢复 443。
#                     ⚠ 换绑**不能**走 ALB OpenAPI：本批 ALB 是 ServiceManagedResource，
#                     自有 AK 直调写操作 3/3 回 OperationDenied.ServiceManagedResource（实测）。
#   保管目录（600）    /root/.deploy_secrets/TLS_WILDCARD_{CRT,KEY}
#   到期告警          控制台已配（2026-10-12 负责人自配；CAS 无提醒类 API，故无回读证据）

cert:
  cert_identifier: 606823-ap-southeast-1
  cas_instance_id: cas_intl-sg-4rf4zyk0u00s
  region: ap-southeast-1        # CAS 国际站控制面地域
  custody_dir: /root/.deploy_secrets
  expire_after: "2027-04-28"
  auto_reissue: enable          # 2026-10-12 实测回读值

targets:
  - target: alb
    status: done                # ✅ 2026-10-12 AlbConfig 钉死证两地 443 部署并回读；2026-10-15 路② 落地（见 evidence_20261015）
    cert_source: |
      2026-10-15 起，两地 443 的**实际出证来源 = Ingress spec.tls 的 Secret/new-api-tls**
      （锚定件 deploy/manifests/ingress-alb-tls-anchor.yaml，同域名压住 AlbConfig 钉死证，已实测）。
      AlbConfig 的 certificates 字段**保留未撤**（仍占 IsDefault=true，兜底位）。
    sites:
      - name: manila-primary
        region: ap-southeast-6
        load_balancer: alb-1riqckb1h8ezm0y7s9
        listener_https: lsn-hjl2cz2g9oqvee4eix
        readback: "GetListenerAttribute → ListenerProtocol=HTTPS, Certificates=606823-ap-southeast-1"
      - name: singapore-standby
        region: ap-southeast-1
        load_balancer: alb-amdwm60xmznh7s1nae
        listener_https: lsn-iqn5i233mvv7eu4u6w
        readback: "GetListenerAttribute → ListenerProtocol=HTTPS, Certificates[0].CertificateId=606823-ap-southeast-1"
    notes: 80 监听由 Ingress/new-api-http-redirect（order=1）对 www.likha.hk / likha.hk 做 HTTP→HTTPS 301
    evidence_20261012:
      listener_certs: "ListListenerCertificates 实测两地各 1 张、CertificateId=606823-ap-southeast-1、IsDefault=true（无多证书兜底）"
      controller: "两集群 addon alb-ingress-controller = v3.1.1 / state=active（cs list-cluster-addon-instances）"
      cas_inventory: "CAS 侧可见性：ListCloudResources --CloudName aliyun --CloudProduct ALB → Id=37274711(mnl lsn) / 37274712(sg lsn)、Status=Running、DefaultResource=1；⚠ 这是资源登记，不等于托管会自动写入"
      probe_cas_deploy: |
        2026-10-12 写探针（授权内，执行器 deploy/logs/t_p2_w3_casrun.sh）：CreateDeploymentJob --JobType user
        --CertIds 606823 --ResourceIds 37274712 --ContactIds 10232 → JobId=7588，状态机 editing→pending→scheduling
        后 worker Status=success（SuccessCount 1 / FailedCount 0 / CostCount 0，--estimate-cost 回 no pricing ⇒ 不计费），
        未被 ServiceManagedResource 拦。⚠ 判据上限：同证同监听 ⇒ "success" 无法区分"写入"与"已一致短路"，
        不能据此认定 CAS 能改 CertId；且 AutoReissue=enable 本身不产生作业（写前 ListDeploymentJob Total=0）。
        作业已 DeleteDeploymentJob，复验 Total=0，无残留。
      probe_secret_route: |
        2026-10-12 路② 结构探针（sg 备站，一次性自签证书，未搬动生产私钥；执行器 t_p2_probe2_body.sh /
        t_p2_probe2_rollback.sh / t_p2_alb_state.sh / t_p2_final_check.sh）：
          ① 不重建监听：加 spec.tls 前后 443 ListenerId 恒为 lsn-iqn5i233mvv7eu4u6w，原 4 条 RuleId 逐字保留
             （只有 Priority 因新 Ingress order 重排 ⇒ 台账按 RuleId 记，不按 Priority）⇒ Replace 风险只在路①。
          ② 共存成立：监听证书变 2 张，Secret 证 IsDefault=false，AlbConfig 钉死的 606823 仍 IsDefault=true，
             且 AlbConfig spec 未被改写（仅 status 回显）。
          ③ 机制：控制器把 Secret 上传成 CAS 证书再绑定，命名 {ns}-{ingress}-{identity}
             （实测 new-api-new-api-tls-probe-3c13f0，InstanceId=cas-upload-wsurj5，端点在 cn-hangzhou 而非资源地域）
             ⇒ 每次换证新增一条上传证书记录，需纳入清理与命名预期。
          ④ 瞬态告警：Secret 生效瞬间其余 4 件 Ingress 各报一轮 FailedApplyModel「名称重复」（77s 内 x5 后停止，
             未阻塞绑定结果）⇒ 路② 验收把这条列为预期内瞬态，不能当故障回滚。
          ⑤ 回滚干净：删探针 Ingress+Secret 后 15s 监听回到 1 张证，www.likha.hk 端到端 200 + Verification OK，
             mnl 未受影响；孤儿上传证已 DeleteUserCertificate --region cn-hangzhou --CertId 27793254 并复验。
      probe_sni_priority: |
        2026-10-13 同域名选优探针（sg 备站，两张一次性自签通配证，未搬动生产私钥；执行器
        deploy/logs/t_p28_w1_apply.sh / t_p28_observe.sh / t_p28_w3_apply_short.sh / t_p28_observe2.sh）：
        设计要点 = 让 Secret 证与钉死证对同一 SNI 的**命名匹配完全等价**（自签 SAN 逐字 = *.likha.hk,likha.hk），
        backend 用 308 Redirect 作"模型已应用"门禁（首采样即 308，排除上轮"规则没生效"的污染）。
          甲 长有效期自签（notAfter=2036-10-10 → CAS 上传证 27815723-cn-hangzhou）：监听 2 张、
             Secret 证 IsDefault=false 而钉死 606823 仍 IsDefault=true，SNI 采样 6/6 回 Secret 证。
          乙 短有效期自签（notAfter=2026-10-15，仅 2 天 ≪ 钉死证剩余 202 天 → 27816034-cn-hangzhou）：
             SNI 采样 8/8 仍回 Secret 证 ⇒ **排除"剩余有效期更长者优先"这一解释**。
          ⇒ 结论：**选优规则 = 来源优先（Ingress spec.tls 的 Secret 覆盖 AlbConfig 钉死证）**；
             IsDefault=true 只决定兜底归属，不决定同域名出证归属。
          ⚠ 覆盖是**监听级**、与 tls.hosts 写了哪些域无关：本轮 tls.hosts 只放探针独占域，
             www.likha.hk / sg.likha.hk 的出证照样被换成 Secret 证 ⇒ **一张坏 Secret 会立即盖掉两地 443
             的正常出证**。定时刷 Secret 的执行器必须"校验通过才写"（SAN 覆盖 + -modulus 配对 +
             notAfter 未过期 + 链 leaf 在前），任一项不过拒绝写入并告警，禁止"先写再修"。
          复原：两轮各删 Ingress+Secret 后监听回到 1 张证、www/sg 握手 serial 回钉死生产证
             09CEC25739B87C4B17FEE2588AEE4F60、Verification OK、likha.hk=308 / sg.likha.hk=200、
             443 仍是原 4 条 RuleId；孤儿上传证已按 SerialNo 白名单 DeleteUserCertificate 并复验 TotalCount=0；
             mnl 主站对照 6/6 未受影响（见 t_p28_mnl_control.sh / t_p28_mnl_jitter.sh）。
          ⚠ 撤回上一版 probe_open 的推论：那张探针自签证的 SAN 是精确 host、本不覆盖 www，
             "www 回钉死证"对两个假设都成立 ⇒ 当时不构成优先级证据。
    evidence_20261015: |
      2026-10-15 **路② 正式落地（两地，生产真证）** —— 负责人指令链：「做到无需人工，可以使用路②」
      →「使用甲」（落地通道 = ECS 云助手 RunCommand 下发）→「执行」（顺序 sg 先、mnl 后）。
      执行器（全部在 deploy/logs/，已被 .gitignore 忽略，不落仓库）：
        W1a 本机拆块 DER→tar.gz→base64 载荷 + 生成节点脚本；W1b 节点侧门禁 + create secret tls + etcd 回读；
        W2 两地 apply 锚定件；W3 只读验收。驱动 = t_p29_run_drv.sh（ACKCTL_DIR=/tmp/ac-p29-<site>）。
      落地物：
        · Secret/new-api-tls（type kubernetes.io/tls，keys tls.crt/tls.key）：sg rv=11112827 / mnl rv=12170377；
          etcd 回读解码复验 = serial 09CEC25739B87C4B17FEE2588AEE4F60、SAN 含 *.likha.hk + likha.hk、
          notAfter 2027-04-28、-modulus 配对 md5 df343b7977ad59775bccf3ec5c128fac、链 3 块 leaf 在前。
        · Ingress/new-api-tls-anchor（两地同名同内容）见 deploy/manifests/ingress-alb-tls-anchor.yaml；
          新增云端规则 sg rule-46rys9zt14zla404h7（Priority=5）/ mnl rule-8t6zyxj3ws6i7jayf4（Priority=4）。
      验收（2026-10-15 实测，回写仓库前重跑一次复现）：
        · ListListenerCertificates 两地各 **cert_count=2**：Secret 证（mnl 27857412-cn-hangzhou /
          sg 27857392-cn-hangzhou）IsDefault=False，钉死 606823-ap-southeast-1 仍 IsDefault=True。
        · SNI 采样 10/10（三入口 × ALB 域名直连/公网 DNS）serial + chain=3 + Verification OK 与落地前基线逐字一致
          ⇒ 换源后**实际出证内容未变**（同一张生产证），路② 是"换来源"不是"换证书"。
        · 业务码不变：www 200 / sg.likha.hk 200 / likha.hk 308→www / img.likha.hk 200；
          tls-anchor.internal.likha.hk 无 DNS 记录（锚定域名不可达，符合设计）。
        · 规则台账：sg 原 4 条 RuleId 与 Priority **逐字未动**（baseline_all_present=True missing=[]），
          anchor 只新增一条；mnl 443 由 3→4 条。既有 Ingress resourceVersion 全部未变 ⇒ 未碰业务件。
        · AlbConfig mnl-alb / sg-alb 的 certificates=[{606823-ap-southeast-1, IsDefault:true}] **保留未撤**
          （撤 = 触碰 Replace 语义，见 evidence_20261012.probe_secret_route ①）。
      副产物（清理台账）：控制器为每个 Secret 在 CAS 生成一条上传证书
        （命名 {ns}-{secretName}-{identityHash} = new-api-new-api-tls-9951c5，InstanceId=cas-upload-gyuf01，
         **端点 cn-hangzhou**）⇒ 清理须 `aliyun cas DeleteUserCertificate --region cn-hangzhou --CertId <id>`。
        注意 ListUserCertificateOrder --OrderType CERT 看不到它（要看 --OrderType UPLOAD；BOTH 回 0）。
      私钥暴露面（甲通道，负责人已按「接受」留痕 —— 指南任务 3 卡）：
        · ActionTrail LookupEvents 回 requestParameters.CommandContent，默认留存 90 天；
          正文 ContentEncoding=Base64 且解码后 ascii_ratio=1.00（等价明文可读）。
        · ecs DescribeInvocations **也**回顶层 CommandContent（sg 186/187 条、mnl 250/250 条带正文；
          最早可回溯 sg 15 天 / mnl 9 天）⇒ 比原描述**多一处**服务端副本（已更正）。
        · DescribeInvocationResults 只有 Output（无正文）；DescribeCommands 对非常驻命令回 TotalCount=0；
          DescribeTrails → trail_count=0 ⇒ 无 OSS/SLS 投递，无额外长期副本。
        · 可读主体 = 任何有 actiontrail:LookupEvents 或 ecs:DescribeInvocations 权限的 RAM 主体 + root。
      残留处置：两节点 /root/.deploy_secrets 空目录（0700，leftover_files=0）、本机 /tmp/p29-* 已 shred。
      ⚠ 载荷体积：RunCommand 正文上限 16KB（CmdContent.ExceedLimit，实测首投 25.5KB 失败且**无任何写入**）
        ⇒ 私钥/证书必须拆块 DER + tar.gz + base64（15360B → 8487B）；节点 Python 是 3.6，
        无 subprocess.capture_output。

  - target: oss
    status: done                # ✅ 2026-10-13 img.likha.hk 绑定完成并端到端验证
    doc: deploy/docs/OSS静态资源域名img.likha.hk_配置与证书续期_2026-10-13.md   # 配置全过程 + 续期复验口径
    sites:
      - name: image-static
        region: ap-southeast-6
        bucket: img-likha
        domain: img.likha.hk
        cert_type: CAS
        readback: "ossutil api list-cname --bucket img-likha → Certificate{CertId,Status=Enabled,Fingerprint,ValidEndDate}"
    notes: |
      ⚠ OSS 自定义域名的 HTTPS 证书**按 CertId 引用**（Type=CAS），**不读 AlbConfig** ——
      换证 = 重新 put-cname，与 ALB 的「改 AlbConfig + apply」是**两条独立通道**，必须分别做。
      ⚠ 判「公共读是否生效」**不能**只看 GetBucketAcl：新建桶的桶级「阻止公共访问」(BPA) 默认为 true，
      会让 public-read **静默失效**（匿名访问 403，而 ACL 读回仍是 public-read）⇒ 须显式
      `ossutil api put-bucket-public-access-block --bucket img-likha --public-access-block-configuration '{"BlockPublicAccess":false}'`。
    evidence_20261013:
      bind: "create-cname-token → 写 TXT _dnsauth.img → put-cname（归属验证是硬门槛，直接 put-cname 回 NeedVerifyDomainOwnership）"
      cert_field: "证书节点名必须是 **CertificateConfiguration**；写成 Certificate 会被**静默忽略**（调用仍返回成功但证书不生效）"
      baseline: "OSS 绑定侧 Fingerprint=74:94:59:28:43:BF:B9:62:87:D2:6D:73:08:38:E0:E7:16:2E:42:B3 / ValidEndDate=Apr 28 23:59:59 2027 GMT，与实际握手证书逐字一致"
      e2e: "https://img.likha.hk/LIKHA.png → 200 / ssl_verify_result=0；不存在对象 404；匿名 ListObjects 403（未暴露对象清单）"
    renew_action: |
      R1 换证后若 CertId ≠ 606823-ap-southeast-1 ⇒ 必须重绑本目标（**与两地 ALB 的 AlbConfig 换绑是两件独立的事**）：
        ossutil api put-cname --bucket img-likha \
          --cname-configuration '{"Cname":{"Domain":"img.likha.hk","CertificateConfiguration":{"CertId":"<新CertId>","Force":true}}}'
      若 CertId 未变（同证内容更新），仍须复验 list-cname 的 Fingerprint/ValidEndDate 是否跟上新证。

  - target: waf
    status: not-in-this-round   # ⏸ 2026-10-12 裁定（指南 §0.5 F15）：本轮不购买 WAF 3.0 ⇒ 不下发
    blocked_on: 业务量增长后复评购买（控制台订阅，waf-openapi 无 CreateInstance）
