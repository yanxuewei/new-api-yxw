# ⚠️ 已废弃（2026-10-08）：被 `clusterpipelineconfig-app-file.yaml` / `…-sg.yaml`
#    （新式 ClusterAliyunPipelineConfig）取代，两集群的 `AliyunLogConfig/new-api-app-file` 已删除。
#    原因：本老式 CRD 的控制器会把 inputDetail 里未登记的键静默剥掉，纳秒开关
#    `enable_timestamp_nanosecond` 到不了 SLS。⚠ 但注意：迁移后实测**文件采集拿不到 ms**
#    （内容 `[GIN] … 18:31:49` 只有秒，且无 `_time_` 类亚秒字段）⇒ ns 开关对 app-file 是"预留"，
#    要真出 ms 需先让 new-api 日志格式带毫秒（代码改动）。容器元数据也**只能**是 `__tag__:` 前缀
#    （文件采集天生如此，`UsingOldContentTag` 无效）——详见 Day3任务26_SLS与可观测_执行报告.md「追加 3」。
#
# 任务 26 步骤 2（纠正版，2026-10-06）：new-api 容器**文件日志**采集
#
# 与卡内原始写法的差异（卡内三处不成立，取证见 Day3任务26_SLS与可观测_执行报告.md §一）：
#   ① 路径：卡内 `/app/logs` 不存在 ⇒ 实际 `/data/logs`（镜像 WORKDIR=/data）
#   ② 开关：卡内 `LOG_DIR` env 不存在 ⇒ 代码只认 CLI `-log-dir`（common/init.go:22），
#      已在 stable/standby 两个 Deployment 加 `args: ["-log-dir=/data/logs"]` + emptyDir 挂载
#   ③ 落点：卡内 `project: sls-newapi-mnl` 不被 CRD 支持（**CRD 无 project 字段**，项目由 logtail
#      附加组件绑定）⇒ 实际写入 `k8s-log-<clusterId>`，故 `app-file` Logstore 已在
#      `k8s-log-cd57…` / `k8s-log-ca75…` 内建好（脚本 `deploy/sls/provision_app_file_sink.sh`）
#   ④ 格式：日志为纯文本（`[LEVEL] … | id | msg` 与 `[GIN] …`），**非 JSON** ⇒ 用 `common_reg_log`
#      （每行一条），查询走全文索引；卡内 `logType: json_log` 口径作废
#
# 注意：文件内容 = stdout 子集（logger.go MultiWriter）⇒ 本配置为**冗余留存**，
#       价值仅在"文件侧可按文件/轮转边界查询"，stdout 主路（aliyunlogconfig-app-stdout.yaml）不可省。
apiVersion: log.alibabacloud.com/v1alpha1
kind: AliyunLogConfig
metadata:
  name: new-api-app-file
  namespace: new-api
spec:
  logstore: app-file
  logtailConfig:
    configName: new-api-app-file
    inputType: file
    inputDetail:
      # 2026-10-08：开启纳秒时间戳（同 app-stdout）。
      # ⚠ 本配置未配时间提取（logType=common_reg_log 无 timeKey）⇒ 日志时间 = 采集时刻，
      #   ns 部分也是采集时刻；若改为从内容提取时间（[GIN] 2026/10/08 - 14:20:24 只有秒），
      #   ns 部分恒为 0 —— 内容侧要 ms 需 new-api 日志格式先带 ms。
      enable_timestamp_nanosecond: true
      logType: common_reg_log
      logPath: /data/logs
      filePattern: "*.log"
      # ⚠ 容器路径映射的**正确字段是 `dockerFile`**（ACK 沿用旧名）：实测置 true 后
      #   logtail 生成的 pipeline 才出现 `EnableContainerDiscovery: true`；
      #   写成 `containerFile: true` 会被翻译丢弃 ⇒ logPath 当**宿主机**路径解析 ⇒ 0 采集。
      dockerFile: true
      # 只扫 /data/logs 一层（不递归子目录）
      maxDepth: 1
