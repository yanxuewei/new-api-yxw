# G6 模板渲染件 · 马尼拉 ALB AlbConfig + IngressClass（对应 v2.0 指南 §6.3 任务 19）
# 由 deploy/aliyun/ph/albconfig.yaml.tpl 渲染，**真实资源 ID 已回填**（2026-09-29 CLI 实测）。
#
# 与模板的两处订正（模板 bug，已就地修正）：
#   ① IngressClass 是**集群级**资源，模板误写了 metadata.namespace（应删除；否则语义误导）。
#   ② AlbConfig 挂载在 namespace: new-api —— 该 ns 由任务 17 创建，本渲染件执行前需存在。
#
# ⚠️ 未回填项（阻塞执行，见交付说明）：
#   ${CERT_ID_ALB} = CAS 证书 ID。2026-09-29 实测 `aliyun cas ListUserCertificateOrder`
#   TotalCount=0（账号内**无任何证书**），且 likha.hk 的 NS 仍指向 GoDaddy
#   （ns21/ns22.domaincontrol.com），G4(NS)/G5(证书) 均未闭环 → 443 监听无法按方案创建。
#   回填方式：`export CERT_ID_ALB=<cas-cert-id>` 后由 deploy/task19_alb_mnl.sh 渲染。
#
# 管理红线（§6.3 坑 4）：ALB 只经 AlbConfig/Ingress 声明式管理，禁止控制台手工改 listener/转发规则。
# 参数依据（P0-5，勿改回方案 v2.1 原值）：requestTimeout 上限 600s；idleTimeout 60s 是"两包之间静默间隔"。
apiVersion: alibabacloud.com/v1
kind: AlbConfig
metadata:
  name: mnl-alb
  namespace: new-api
spec:
  config:
    name: alb-newapi-mnl
    addressType: Internet
    zoneMappings:
      - vSwitchId: vsw-5ts9tgdq1xz3picjgoqyu   # vsw-mnl-pub-a / ap-southeast-6a / 10.0.0.0/24 / free=251
      - vSwitchId: vsw-5ts1dygyh2x0daspwny2r   # vsw-mnl-pub-b / ap-southeast-6b / 10.0.1.0/24 / free=252
    accessLogConfig:
      logProject: sls-newapi-mnl               # ✅ 2026-09-29 实测存在
      logStore: alb_access                     # ✅ 2026-09-29 实测存在（16 个 Logstore 之一）
    tags:
      - { key: project, value: new-api }
      - { key: site, value: ph-mnl }
      - { key: env, value: prod }
  listeners:
    - port: 80
      protocol: HTTP                           # 仅用于 301 跳转 HTTPS
      httpDefaultActions:
        - type: Redirect
          redirectConfig: { host: www.likha.hk, https: on, port: "443" }
    # ⚠️ 442/443 监听当前被证书阻塞：CERT_ID_ALB 为空时由脚本整段剔除（见 task19_alb_mnl.sh --without-tls）
    - port: 443
      protocol: HTTPS
      securityPolicyId: tls_cipher_policy_1_2_strict_with_1_3   # 显式指定，否则可协商 TLS1.0 被安全核查判不合格（坑 3）
      caEnabled: false
      requestTimeout: 600                      # 硬上限（P0-5）
      idleTimeout: 60
      certificates:
        - CertIdentifier: ${CERT_ID_ALB}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb                                  # ✅ 集群级资源，无 namespace（模板已订正）
spec:
  controller: ingress.k8s.alibabacloud/alb
  parameters:
    apiGroup: alibabacloud.com
    kind: AlbConfig
    name: mnl-alb
