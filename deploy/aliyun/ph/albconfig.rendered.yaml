# G6 模板渲染件 · 马尼拉 ALB AlbConfig + IngressClass（对应 v2.0 指南 §6.3 任务 19）
# 由 deploy/aliyun/ph/albconfig.yaml.tpl 渲染，**真实资源 ID 已回填**（2026-09-29 CLI 实测）。
#
# ★ 2026-10-12 已闭环：G5 证书就绪，本件按实况 apply（generation 3 → 4），443 监听已上线并验收 V1–V5。
#   实况核对：`kubectl get albconfig mnl-alb -o jsonpath='{.spec.listeners}'`
#
# ⚠️⚠️ 两个高危笔误（本件已修正，勿改回）：
#   ① `listeners[].certificates[]` 的**字段名必须是 `CertificateId`**，值才是 CertIdentifier
#      （如 `606823-ap-southeast-1`）。写成 `CertIdentifier:` 会因 CRD 是
#      `x-kubernetes-preserve-unknown-fields` 被**静默忽略** ⇒ 证书不绑定、443 形同虚设，
#      且**不报任何错**（v2.0 指南 §6.3 步骤 2 与 albconfig.yaml.tpl 都是错名，见 2026-10-12 订正）。
#   ② `listeners[].httpDefaultActions` / `defaultActions` **实测均不生效** —— Controller 一律用
#      自己的 ForwardGroup 覆盖（占位组 `kube-system-fake-svc-<port>`）⇒ 80 的 301 跳转**不能**写在这里，
#      必须用 Ingress 的 `alb.ingress.kubernetes.io/actions.<name>` + `use-annotation`
#      （落地件：deploy/manifests/ingress-mnl-http-redirect.yaml）。
#
# 管理红线（§6.3 坑 4）：ALB 只经 AlbConfig/Ingress 声明式管理，禁止控制台手工改 listener/转发规则。
#   ★ 技术强制：ACK 托管的 ALB 是 **ServiceManagedResource**，直接调 alb OpenAPI 会被服务端拒绝
#     `OperationDenied.ServiceManagedResource` ⇒ 想手工改也改不了，只能走 AlbConfig。
# ⚠️ finalizer `ingress.k8s.alibaba/resources` ⇒ `kubectl delete albconfig mnl-alb` 会**级联删除云上 ALB**。
# 参数依据（P0-5，勿改回方案 v2.1 原值）：requestTimeout 上限 600s；idleTimeout 60s 是"两包之间静默间隔"。
apiVersion: alibabacloud.com/v1
kind: AlbConfig
metadata:
  name: mnl-alb
  namespace: new-api
spec:
  config:
    name: alb-newapi-mnl
    addressType: Internet
    zoneMappings:
      - vSwitchId: vsw-5ts9tgdq1xz3picjgoqyu   # vsw-mnl-pub-a / ap-southeast-6a / 10.0.0.0/24 / free=251
      - vSwitchId: vsw-5ts1dygyh2x0daspwny2r   # vsw-mnl-pub-b / ap-southeast-6b / 10.0.1.0/24 / free=252
    accessLogConfig:
      logProject: sls-newapi-mnl               # ✅ 2026-09-29 实测存在
      logStore: alb_access                     # ✅ 2026-09-29 实测存在（16 个 Logstore 之一）
    tags:
      - { key: project, value: new-api }
      - { key: site, value: ph-mnl }
      - { key: env, value: prod }
  listeners:
    - port: 80
      protocol: HTTP
      idleTimeout: 60
      requestTimeout: 600
      # ⚠️ 这里**不要**写 httpDefaultActions/defaultActions（实测不生效，见文件头⚠️②）。
      #    HTTP→HTTPS 301 走 Ingress：deploy/manifests/ingress-mnl-http-redirect.yaml（已落地并验收）。
    - port: 443
      protocol: HTTPS
      idleTimeout: 60
      requestTimeout: 600
      caEnabled: false
      securityPolicyId: tls_cipher_policy_1_2_strict_with_1_3
      # ↑ 显式指定，否则可协商 TLS1.0 被安全核查判不合格（坑 3）。
      #   2026-10-12 实测：TLS1.3 正常协商；TLS1.0/1.1 被服务端 `tlsv1 alert protocol version`(70) 拒绝。
      certificates:
        - CertificateId: 606823-ap-southeast-1   # ← 字段名必须是 CertificateId（值才是 CertIdentifier）
          IsDefault: true
      # ★ 跨地域可用（2026-10-12 实测结论）：本地 CAS 口径 ap-southeast-1 的证书，
      #   可被 ap-southeast-6（马尼拉）的 ALB 直接引用并成功 Associated。
      #   反面事实：`cas` 产品在 ap-southeast-6 **无 endpoint**（连 DNS 都不存在），
      #   故「马尼拉 ALB 用不了证书」的推断不成立 —— ALB 侧不要求证书与实例同地域。
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb                                  # ✅ 集群级资源，无 namespace（模板已订正）
spec:
  controller: ingress.k8s.alibabacloud/alb
  parameters:
    apiGroup: alibabacloud.com
    kind: AlbConfig
    name: mnl-alb
