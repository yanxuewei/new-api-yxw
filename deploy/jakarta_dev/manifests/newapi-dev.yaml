# 雅加达 dev · newapi-dev 工作负载（任务 2d）
#
# 形状抄生产 deploy/aliyun/ph/stable-deployment.yaml，但按 dev 实况收紧，四处**有意偏差**都有实测依据：
#   ① 镜像走 **马尼拉 EE 公网入口**（`...registry.ap-southeast-6...`，不是生产用的 `-vpc` 内网域名）：
#      dev 在雅加达，跨区拉取按裁定复用同一 EE 实例（ACR EE 另购太贵）。实测节点侧
#      `https://acr-newapi-mnl-registry.ap-southeast-6.cr.aliyuncs.com/v2/ = 401`（可达、需鉴权），
#      鉴权由本次装的 `managed-aliyun-acr-credential-helper`（watchNamespace=newapi-dev,
#      serviceAccount=new-api-app）免密承担 —— 所以清单里**不写 imagePullSecrets**。
#   ② `NODE_TYPE=master`：dev 只有一套环境，副本自己承担 AutoMigrate（生产是 master 迁移 / slave 服务的
#      双 Deployment）。因此 **SQL_DSN 显式取 Secret 的 SQL_DSN_MIGRATE**（与 ph/master-deployment.yaml:96-105
#      逐字同构：代码里没有 SQL_DSN_MIGRATE 这个 env，只有 SQL_DSN）。日志库仍走 `LOG_SQL_DSN`
#      （账号 newapi）⇒ dev 的权限口径在主库分 migrate/runtime 两账号，在日志库由 newapi 一肩挑
#      （DDL+DML），这条偏差在 deploy/jakarta_dev/sql/dev_grants.sql 头部写明并被 SQL 落实。
#   ③ DSN 一律 **5432**：dev RDS `pg.n2.2c.1m` 实测**没有托管 PgBouncer**（节点内探测
#      `6432=BLOCKED`、`5432=OPEN`），生产的"主链路走 6432 池"在 dev 无对应物，不能照抄。
#   ④ 副本数 1、requests 500m：dev 节点是 2C/8G 档（生产 8C/32G），照抄 2C/4Gi 会把节点占满。
#
# 红线核对：无明文密钥（Secret 由 deploy/jakarta_dev/scripts/dev_deploy.sh 从堡垒机保管目录注入，
# 2026-10-05 裁定不使用 KMS/RRSA/ExternalSecret）；镜像 tag = 日期+git sha，禁 latest；
# 命名/标签与生产同构便于运维记忆，但集群/VPC/namespace 三层全隔离（无任何跨 VPC 通路）。
---
apiVersion: v1
kind: Namespace
metadata:
  name: newapi-dev
  labels:
    env: dev
    project: new-api
    site: jkt-dev
    isolation: structural-cluster        # 隔离靠独立集群+独立 VPC，不靠 namespace
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: newapi-dev-quota
  namespace: newapi-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "3"
    limits.memory: 6Gi
    pods: "20"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: new-api-app
  namespace: newapi-dev
  labels:
    app: new-api
    env: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-config
  namespace: newapi-dev
  labels:
    app: new-api
    env: dev
data:
  TZ: "Asia/Jakarta"
  NODE_TYPE: "master"                   # dev 偏差②：单副本自持迁移（生产 slave 由 ConfigMap 给 slave）
  MEMORY_CACHE_ENABLED: "false"         # dev 无 Redis ⇒ 这行是真生效（main.go:83-85 只在 RedisEnabled 时强改 true）
  SYNC_FREQUENCY: "30"                  # 代码默认 60（common/init.go:110），与生产同值显式覆盖
  SQL_MAX_OPEN_CONNS: "20"              # 代码默认 1000；dev 1 副本 ⇒ 20 足够，且不撞 pg.n2.2c.1m 的连接上限
  SQL_MAX_IDLE_CONNS: "5"
  # 不写 LOG_SQL_CLICKHOUSE_TTL_DAYS（dev 无 CK）、不写 SQL_MAX_LIFETIME（取代码默认 60s，与生产实况一致）
  # 生产已删的两行空转配置同样不写：LOG_SQL_MAX_OPEN_CONNS、SESSION_MAX_AGE（代码无读取点）
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api-dev
  namespace: newapi-dev
  labels:
    app: new-api
    project: new-api
    site: jkt-dev
    track: dev
    env: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: new-api, track: dev}
  template:
    metadata:
      labels:
        app: new-api
        project: new-api
        site: jkt-dev
        track: dev
        env: dev
      annotations:
        checksum/config: "__CONFIG_CHECKSUM__"   # 由 dev_deploy.sh 用集群现值渲染，避免改 CM 不滚动
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: new-api-app
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway      # dev 单副本 ⇒ 不能用 DoNotSchedule（会永久 Pending）
          labelSelector:
            matchLabels: {app: new-api}
      containers:
        - name: new-api
          image: acr-newapi-mnl-registry.ap-southeast-6.cr.aliyuncs.com/newapi-dev/newapi-master:20261012-a8e646954
          imagePullPolicy: IfNotPresent
          args: ["-log-dir=/data/logs"]          # 与生产同口径（文件日志开关是 CLI 参数，无对应 env）
          ports:
            - {name: http, containerPort: 3000}
          volumeMounts:
            - {name: app-logs, mountPath: /data/logs}
          env:
            - {name: NODE_TYPE, value: "master"}  # 显式钉住，防被 CM 之外的默认值翻转（common/init.go:89）
            - {name: GOMAXPROCS, value: "1"}      # 生产坑 2 同款：limit 与可见核数不一致必须显式钉
            # GORM logger 默认只打印 >200ms 的语句 ⇒ 空库首启抓不到 DDL 会被误判"迁移没跑"。
            # 与 deploy/aliyun/ph/master-deployment.yaml 同口径降到 1ms，日志里能看到每条 DDL。
            - {name: SQL_SLOW_THRESHOLD_MS, value: "1"}
            # ★ 与生产 master 逐字同构（ph/master-deployment.yaml:96-105）：代码里**没有**
            #   SQL_DSN_MIGRATE 这个环境变量，只有 SQL_DSN；而 schema 最小化后 public 只有
            #   newapi_migrate 持 CREATE ⇒ master 的 SQL_DSN 必须取 Secret 的 SQL_DSN_MIGRATE，
            #   否则 AutoMigrate 必报 permission denied for schema public。显式 env 优先于 envFrom。
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-secrets
                  key: SQL_DSN_MIGRATE
          envFrom:
            - configMapRef: {name: new-api-config}
            - secretRef: {name: new-api-secrets}
          startupProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/status, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
      volumes:
        - name: app-logs
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-dev
  namespace: newapi-dev
  labels: {app: new-api, track: dev}
spec:
  type: ClusterIP
  selector: {app: new-api, track: dev}
  ports:
    - {name: http, port: 80, targetPort: http}
