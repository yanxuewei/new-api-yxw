# deploy/jakarta_dev/manifests/dev_routes.yaml —— dev 个人域名路由（2026-10-16，负责人裁定「按人指负载」）
#
# DNS（likha.hk zone，alidns）：dev-yxw / dev-zzj / dev-xd 三条 CNAME →
#   alb-4okmogghe7hbv5fwm6.ap-southeast-5.alb.aliyuncsslbintl.com（dev ALB，与 dev 记录同值，TTL 600）
#   RecordId：dev-yxw=2111042095309275136 / dev-zzj=2111042099759426560 / dev-xd=2111042103756663808
# 本文件只管 ALB 之后的 host 路由（镜像 dev.likha.hk 的两件套：443 host 规则 + 80 301 redirect）。
#
# 路由表（负责人 2026-10-16 指定）：
#   dev-yxw.likha.hk → svc/yxw-new-api-slave（原 fanyan-new-api-* 改名；replicas=0 时该域 503，扩副本即恢复）
#   dev-zzj.likha.hk → svc/new-api-dev-slave（先指向公共 dev slave，各自负载建好后切）
#   dev-xd.likha.hk  → svc/new-api-dev-slave（同上）
#
# 443 证书：dev ALB 监听 lsn-22gsroti342rp3dvo4 默认证 = 606823-ap-southeast-1（*.likha.hk 通配符），
#   三个新子域自动覆盖，无需任何换绑（与 dev.likha.hk 同一来源）。
# order：redirect 用 2/3/4、443 用 51/52/53 —— 与 dev.likha.hk 的 1/50 错开（host 规则互不重叠，仅为消歧义）。
---
apiVersion: v1
kind: Service
metadata:
  name: yxw-new-api-slave
  namespace: newapi-dev
  labels: {app: yxw-new-api-slave, env: dev, project: new-api, site: jkt-dev}
spec:
  type: ClusterIP
  selector: {app: yxw-new-api-slave}   # 与 deploy/yxw-new-api-slave 的 pod 标签一致
  ports:
    - name: http
      port: 80
      targetPort: http                  # 容器 named port http=3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-yxw-route
  namespace: newapi-dev
  labels: {app: yxw-new-api-slave, env: dev, project: new-api, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/order: "51"
spec:
  ingressClassName: alb
  rules:
    - host: dev-yxw.likha.hk
      http:
        paths:
          - backend:
              service: {name: yxw-new-api-slave, port: {number: 80}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-yxw-route-http-redirect
  namespace: newapi-dev
  labels: {app: yxw-new-api-slave, env: dev, project: new-api, purpose: http-to-https-redirect, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/order: "2"
    alb.ingress.kubernetes.io/actions.redirect: '[{"type":"Redirect","RedirectConfig":{"host":"dev-yxw.likha.hk","path":"${path}","port":"443","protocol":"HTTPS","query":"${query}","httpCode":"301"}}]'
spec:
  ingressClassName: alb
  rules:
    - host: dev-yxw.likha.hk
      http:
        paths:
          - backend:
              service: {name: redirect, port: {name: use-annotation}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-zzj-route
  namespace: newapi-dev
  labels: {app: new-api-dev-slave, env: dev, project: new-api, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/order: "52"
spec:
  ingressClassName: alb
  rules:
    - host: dev-zzj.likha.hk
      http:
        paths:
          - backend:
              service: {name: new-api-dev-slave, port: {number: 80}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-zzj-route-http-redirect
  namespace: newapi-dev
  labels: {app: new-api-dev-slave, env: dev, project: new-api, purpose: http-to-https-redirect, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/order: "3"
    alb.ingress.kubernetes.io/actions.redirect: '[{"type":"Redirect","RedirectConfig":{"host":"dev-zzj.likha.hk","path":"${path}","port":"443","protocol":"HTTPS","query":"${query}","httpCode":"301"}}]'
spec:
  ingressClassName: alb
  rules:
    - host: dev-zzj.likha.hk
      http:
        paths:
          - backend:
              service: {name: redirect, port: {name: use-annotation}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-xd-route
  namespace: newapi-dev
  labels: {app: new-api-dev-slave, env: dev, project: new-api, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/order: "53"
spec:
  ingressClassName: alb
  rules:
    - host: dev-xd.likha.hk
      http:
        paths:
          - backend:
              service: {name: new-api-dev-slave, port: {number: 80}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-xd-route-http-redirect
  namespace: newapi-dev
  labels: {app: new-api-dev-slave, env: dev, project: new-api, purpose: http-to-https-redirect, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/order: "4"
    alb.ingress.kubernetes.io/actions.redirect: '[{"type":"Redirect","RedirectConfig":{"host":"dev-xd.likha.hk","path":"${path}","port":"443","protocol":"HTTPS","query":"${query}","httpCode":"301"}}]'
spec:
  ingressClassName: alb
  rules:
    - host: dev-xd.likha.hk
      http:
        paths:
          - backend:
              service: {name: redirect, port: {name: use-annotation}}
            path: /
            pathType: Prefix
