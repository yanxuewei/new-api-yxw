# deploy/jakarta_dev/perf_pre_routes.yaml —— perf / pre 环境对外域名（2026-10-19）
#
# 需求（fanyan）：参照 dev 域名，为 `new-api-perf` 与 `new-api-pre` 两个命名空间增加
#   `perf` / `pre` 域名，同样用 CNAME 建立。
#
# DNS（likha.hk zone，alidns）：perf / pre 两条 CNAME →
#   alb-4okmogghe7hbv5fwm6.ap-southeast-5.alb.aliyuncsslbintl.com（dev ALB，与 `dev` 记录同值，TTL 600）
#   与 dev / dev-yxw / dev-zzj / dev-xd 完全同构。
#   RecordId：perf=2112138172661508096 / pre=2112138172414424064（TTL 600，Line default）
#
# 路由表：
#   perf.likha.hk → svc new-api-perf:80   （namespace new-api-perf，deployment new-api-perf）
#   pre.likha.hk  → svc new-api-pre:80    （namespace new-api-pre， deployment new-api-pre）
#
# 443 证书：dev ALB（AlbConfig jkt-alb / alb-4okmogghe7hbv5fwm6）监听默认证 =
#   606823-ap-southeast-1（*.likha.hk 通配符；实测 SAN = *.likha.hk, likha.hk，有效期至 2027-04-28）
#   ⇒ perf / pre 自动被覆盖，**无需换绑、无需新签**。
#
# order：与既有 host 规则错开 —— dev.likha.hk=1/50、dev-yxw=2/51、dev-zzj=3/52、dev-xd=4/53
#   ⇒ 本文件：redirect 用 5/6，443 用 54/55。（host 本就互不重叠，order 仅用于消歧义）
#
# 应用：kubectl apply -f deploy/jakarta_dev/perf_pre_routes.yaml（经 deploy/lib/ack_remote_jkt_dev.sh）
# 回滚：kubectl delete -f deploy/jakarta_dev/perf_pre_routes.yaml
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perf-route
  namespace: new-api-perf
  labels: {app: new-api-perf, env: perf, project: new-api, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/order: "54"
spec:
  ingressClassName: alb
  rules:
    - host: perf.likha.hk
      http:
        paths:
          - backend:
              service: {name: new-api-perf, port: {number: 80}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perf-route-http-redirect
  namespace: new-api-perf
  labels: {app: new-api-perf, env: perf, project: new-api, purpose: http-to-https-redirect, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/order: "5"
    alb.ingress.kubernetes.io/actions.redirect: '[{"type":"Redirect","RedirectConfig":{"host":"perf.likha.hk","path":"${path}","port":"443","protocol":"HTTPS","query":"${query}","httpCode":"301"}}]'
spec:
  ingressClassName: alb
  rules:
    - host: perf.likha.hk
      http:
        paths:
          - backend:
              service: {name: redirect, port: {name: use-annotation}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pre-route
  namespace: new-api-pre
  labels: {app: new-api-pre, env: pre, project: new-api, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/order: "55"
spec:
  ingressClassName: alb
  rules:
    - host: pre.likha.hk
      http:
        paths:
          - backend:
              service: {name: new-api-pre, port: {number: 80}}
            path: /
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pre-route-http-redirect
  namespace: new-api-pre
  labels: {app: new-api-pre, env: pre, project: new-api, purpose: http-to-https-redirect, site: jkt-dev}
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/order: "6"
    alb.ingress.kubernetes.io/actions.redirect: '[{"type":"Redirect","RedirectConfig":{"host":"pre.likha.hk","path":"${path}","port":"443","protocol":"HTTPS","query":"${query}","httpCode":"301"}}]'
spec:
  ingressClassName: alb
  rules:
    - host: pre.likha.hk
      http:
        paths:
          - backend:
              service: {name: redirect, port: {name: use-annotation}}
            path: /
            pathType: Prefix
