# staging · 50 集群内 Redis（不与 prod Tair 共用）
#
# 为什么不用 prod Tair r-5tsf1fe16543e274：
#   ① 单实例、**DB 0、default 账号**，键名**无环境前缀**（deploy/tasks/task7/tair.sh:173；
#      middleware/rate-limit.go:128,224 的 rateLimit:<uid> / <mark>+clientIP；
#      middleware/model-rate-limit.go:88,102 的 <mark>:user:<id>）
#      ⇒ staging 与 prod 撞同一 key 空间，限流计数、模型标记互相污染，**不是"加前缀"能解决的**
#   ② allkeys-lru 淘汰是实例级的 ⇒ staging 灌数据会淘汰 prod 键
#   ③ prod Tair **包月 10-28 到期**（Day1任务4 §七），staging 依赖它等于把非生产生命周期挂在生产续费上
#   ④ 新加坡侧建 Tair 已被 Trade_Not_Support_Async_Pay + 余额 0.00 卡住（logs/task29_tair_sg/），
#      prod sg 副本当前 redis=unset、限流退化为单 Pod 内存（Day2任务28:73 / 任务53:27）
#      ⇒ 非生产不必受这条阻塞，集群内自建即可（任务45:§6 建议口径）
#
# 真落地了计划里那条命令禁用（deploy/tasks/task29/tair_sg.sh:22 曾只是纸面）：
#   禁 FLUSHALL / FLUSHDB / KEYS / CONFIG / SHUTDOWN / DEBUG
# 代码侧事实：非测试 Go 代码**无** Redis FlushAll/FlushDB 调用（grep 仅命中 c.Writer.Flush）
#           ⇒ 风险主要来自人/CI 误操作与压测，不是业务代码，所以 ACL 禁用是有效边界。
# ⚠ 单副本无持久化 = 可丢（限流/缓存语义可容忍）；需要跨重启保数据再挂 emptyDir→PVC，属另案。
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-staging-auth
  namespace: new-api-staging
type: Opaque
stringData:
  password: REPLACE_ME_REDIS_PW
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-staging
  namespace: new-api-staging
  labels:
    app.kubernetes.io/name: redis-staging
    env: staging
spec:
  replicas: 1
  strategy:
    type: Recreate          # 单副本 + emptyDir：滚动会同时存在两个 Pod 抢同一份数据语义
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-staging
        project: new-api     # 供 30-networkpolicy.yaml 的 podSelector 命中
        env: staging
    spec:
      serviceAccountName: new-api-app
      containers:
        - name: redis
          # 与主应用同一 ACR 命名空间内自建镜像（redis:7 需先推上去；Docker Hub 在 VPC 内不可达）
          image: acr-newapi-mnl-registry.ap-southeast-6.cr.aliyuncs.com/newapi-prod/redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PW)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            - --rename-command
            - FLUSHALL ""
            - --rename-command
            - FLUSHDB ""
            - --rename-command
            - KEYS ""
            - --rename-command
            - CONFIG ""
            - --rename-command
            - DEBUG ""
            - --rename-command
            - SHUTDOWN ""
            - --save ""
            - --appendonly no
          env:
            - name: REDIS_PW
              valueFrom:
                secretKeyRef:
                  name: redis-staging-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis-staging
  namespace: new-api-staging
  labels:
    app.kubernetes.io/name: redis-staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-staging
  ports:
    - name: redis
      port: 6379
      targetPort: redis
