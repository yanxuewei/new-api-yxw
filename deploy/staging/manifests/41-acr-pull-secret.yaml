# staging · 41 ACR 免密拉取兜底（仅当 helper 未纳管本 ns 时才需要）
#
# 为什么需要：任务16 坑 5 —— ACR 免密由 managed-aliyun-acr-credential-helper 注入到
#   **指定 SA**（prod 是 new-api-app），换 SA / 换 ns 未纳管就直接 ImagePullBackOff。
# 雅加达 dev 集群是新集群，helper 的纳管范围**未确认** ⇒ 先按"需要手工兜底"写这份。
# 判定命令（--precheck 已包含）：
#   kubectl -n kube-system get deploy cm | grep -i acr
#   kubectl -n new-api-staging get sa new-api-app -o jsonpath='{.imagePullSecrets}'
#   kubectl -n new-api-staging get secret | grep acr-auth
# 若上面已就绪，本文件 **不要 apply**（删掉本节即可，避免两套凭证长期漂移）。
#
# ⚠ 跨地域拉取事实（任务45:E14/E17）：ACR EE 实例 cri-avfqy9xkqi5bj8ee **只在 ap-southeast-6**，
#   VPC 端点绑定只接受实例所在地域的 VPC ⇒ 雅加达**无法**内网拉马尼拉 EE。
#   所以这里必须用**公网端点**域名（`...registry.ap-southeast-6.cr.aliyuncs.com`，无 `-vpc`），
#   并把雅加达 NAT 出网 EIP 加进 EE 公网访问 ACL。
# ★ 现网 ACL 是 0.0.0.0/1 + 128.0.0.0/1（等于失效，任务45:206 / C4）⇒ 本次顺带收口为
#   "雅加达 NAT EIP/32 + 运维出口 IP"，不要为了省事再加回全网。
---
apiVersion: v1
kind: Secret
metadata:
  name: acr-credential-newapi-jkt
  namespace: new-api-staging
  labels:
    app.kubernetes.io/part-of: newapi-acr
type: kubernetes.io/dockerconfigjson
stringData:
  # 用 RAM 用户 newapi-app-mnl（ACR  EE 访问凭证，见 RAM最小权限落地）的**固定密码**
  # 或临时 getauthorizationtoken；值一律走跳板机 /root/.deploy_secrets/ACR_DOCKER_CFG
  .dockerconfigjson: REPLACE_ME_ACR_DOCKER_CONFIG_JSON
---
# 若采用"SA 挂 imagePullSecrets"路径，执行一次（**刻意不写成可 apply 的对象**，避免误建假 Deployment）：
#   kubectl -n new-api-staging patch serviceaccount new-api-app \
#     -p '{"imagePullSecrets":[{"name":"acr-credential-newapi-jkt"}]}'
# 确认：kubectl -n new-api-staging get sa new-api-app -o jsonpath='{.imagePullSecrets}'; echo
