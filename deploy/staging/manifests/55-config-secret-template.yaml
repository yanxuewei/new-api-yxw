# staging · 55 ConfigMap + Secret 骨架
#
# 红线（KMS弃用_手工Secret注入_裁定:70 段 / Day2任务17:129,143）：
#   Secret 的**值**绝不进 Git / CI 变量 / 镜像 / ConfigMap / shell 历史 / 命令行参数。
#   本文件里所有 REPLACE_ME_* 只是**键骨架**，供 task55_staging_apply.sh 从
#   WSL 跳板 /root/.deploy_secrets/<KEY>（0600，用后 shred）读取后现场渲染。
#   现网机制：KMS/凭据管家/ExternalSecret/ack-secret-manager 已整体弃用（太贵），
#   替代为手写 opaque Secret（deploy/task17/manual_secret.sh）。staging 沿用同一机制，
#   但必须是**独立的一把密钥**，不复用 prod 的 new-api-secrets（6 键 mnl / 3 键 sg）。
#
# ★ 与 prod 必须不同的三项（写进 CI 门禁 ci_check_env_isolation.sh）：
#   1) SESSION_SECRET     —— 任务45:372：dev/staging 用生产 SESSION_SECRET ⇒ 其签发的 token 在生产可用。
#                            ⚠ 既有偏差：两地域 prod 实测同值 sha256[:12]=c5fbe2dbc89b（Day2任务17:76），
#                            staging 不得继承该值。
#   2) SQL_DSN            —— 只能指向雅加达 pgm-d9j9p421lzx4gw73 / db newapi_staging；
#                            出现 pgm-5tstdhko64x2c01w 即 fail（任务45:380）。
#   3) REDIS_CONN_STRING  —— 只能指向集群内 redis-staging.new-api-staging.svc:6379；
#                            出现 r-5tsf1fe16543e274（prod Tair）即 fail。
#   另：LOG_SQL_* 不得指向 prod ClickHouse（任务45:F9 非生产不建 CK，日志库复用雅加达 PG）。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-staging-config
  namespace: new-api-staging
data:
  # ---- 与 prod 同构的口径（结构一致、值可不同；预发与正式环境区别.md:138）----
  BATCH_UPDATE_ENABLED: "true"
  SYNC_FREQUENCY: "60"
  # NODE_TYPE / MEMORY_CACHE_ENABLED / GOMAXPROCS 刻意**不在此**：由 60-deployment.yaml 显式写死，
  # 避免 ConfigMap 被误改后把 staging Pod 变成 master（即开始发 DDL）。
  TZ: "Asia/Shanghai"
  # 日志库走雅加达 PG，不建 CK（任务45:F9）
  LOG_SQL_TYPE: "postgres"
  # 留空 ⇒ 不接 prod CK；具体 DSN 在 Secret 里
  LOG_SQL_CLICKHOUSE_TTL_DAYS: "7"
---
apiVersion: v1
kind: Secret
metadata:
  name: new-api-staging-secrets
  namespace: new-api-staging
type: Opaque
stringData:
  # REPLACE_ME_* 由 apply 脚本注入真实值；Git 侧永远保持占位。
  SESSION_SECRET: "REPLACE_ME_STAGING_ONLY"
  SQL_DSN: "postgres://newapi_staging:REPLACE_ME@REPLACE_ME_JKT_RDS_PRIVATE:5432/newapi_staging?sslmode=disable"
  SQL_DSN_MIGRATE: "postgres://newapi_staging_migrate:REPLACE_ME@REPLACE_ME_JKT_RDS_PRIVATE:5432/newapi_staging?sslmode=disable"
  LOG_SQL_DSN: "postgres://newapi_staging:REPLACE_ME@REPLACE_ME_JKT_RDS_PRIVATE:5432/newapi_staging_logs?sslmode=disable"
  REDIS_CONN_STRING: "redis://:REPLACE_ME@redis-staging.new-api-staging.svc.cluster.local:6379/0"
