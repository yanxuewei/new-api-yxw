# staging · 61 Service（内网可达，不加公网 LB）
#
# 口径：预发与正式环境区别.md:126（独立环境不接真实流量、仅内网可达、不加公网 LB）。
# 现状：雅加达侧无 ALB 实例（sg ALB 只有 AlbConfig/IngressClass 已建的**新加坡**那份，
#       马尼拉 ALB alb-1riqckb1h8ezm0y7s9 且仅 HTTP:80、无 443/无证书）。
#       ⇒ staging 访问路径 = VPC 内 ClusterIP；外部验证走 kubectl port-forward（经 ack_remote.sh）。
# 拟用域名（任务45 §5.3）：*.dev.internal.likha.hk —— 需内网 DNS/PrivateZone，属 O2 待办。
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-staging
  namespace: new-api-staging
  labels:
    app: new-api
    track: staging
    env: staging
spec:
  type: ClusterIP
  selector:
    app: new-api
    track: staging
  ports:
    - name: http
      port: 80
      targetPort: http
---
# 冒烟/E2E 夜间任务用（git开发-发布-值班规范.md:470 e2e-nightly 部署 staging 跑冒烟）。
# 与业务 Service 分离，便于单独摘掉；selector 同 track=staging。
apiVersion: v1
kind: Service
metadata:
  name: new-api-staging-smoketest
  namespace: new-api-staging
  labels:
    app: new-api
    track: staging
    env: staging
    newapi.io/purpose: smoketest
spec:
  type: ClusterIP
  selector:
    app: new-api
    track: staging
  ports:
    - name: http
      port: 8080
      targetPort: http
